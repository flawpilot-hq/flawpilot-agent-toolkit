name: release

# Push a tag like v1.0.0 to publish skill ZIPs for Claude.ai, ChatGPT and other clients.
# The tag must match the version in every plugin manifest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Release gate
        run: python scripts/validate_skills.py --strict --release .
      - name: Build ZIPs
        run: python scripts/package_skills.py --out dist .
      - name: Tag must match plugin version
        run: |
          version=$(python -c 'import json; print(json.load(open("dist/manifest.json"))["version"])')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No '## ${GITHUB_REF_NAME#v}' section in CHANGELOG.md" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
